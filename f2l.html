<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>六面 · F2L 公式合集</title>
<link rel="icon" type="image/x-icon" href="cube-64x64.ico">
<link rel="stylesheet" href="css/theme.css">
<script src="js/f2ldata.js"></script>
<style>
  /* 默认浅色（白底）；点右上角按钮切夜晚。不跟随系统 —— 这是打印/速查用的表。
     两套主题的所有颜色变量都在 theme.css 里，这里只管版式。 */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:relative;padding:22px 20px 8px;text-align:center}
  /* 只管位置 —— 开关本身的样式（尺寸/底色/滑块）在 nav.css 里，七页共用 */
  .themebtn{position:absolute;right:16px;top:16px}
  /* 打印：只留按钮，样式交给下面 @media print 里那套白底黑字 */
  .printbtn{position:absolute;right:80px;top:16px;width:28px;height:28px;padding:0;
            border-radius:8px;background:var(--field);border:1px solid var(--line);
            color:var(--muted);cursor:pointer;display:grid;place-items:center;
            transition:color .12s,border-color .12s}
  .printbtn:hover{color:var(--accent-text);border-color:var(--accent-text)}
  /* 表头那三个图标键（恢复默认 / 导出 CSV / 导入 CSV）：和打印键同一套外观 ——
     位置由 js 按 right 排（打印键在 80px，这三个往前 116 / 152 / 188） */
  .toolbtn{position:absolute;top:16px;width:28px;height:28px;padding:0;
           border-radius:8px;background:var(--field);border:1px solid var(--line);
           color:var(--muted);cursor:pointer;display:grid;place-items:center;
           transition:color .12s,border-color .12s}
  .toolbtn:hover{color:var(--accent-text);border-color:var(--accent-text)}
  .toolbtn svg{width:15px;height:15px;display:block;fill:none;stroke:currentColor;
               stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .printbtn svg{width:15px;height:15px;display:block;fill:none;stroke:currentColor;
                stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  h1{margin:0;font-size:20px;letter-spacing:.02em}
  header p{margin:6px 0 0;color:var(--muted);font-size:12.5px}
  main{max-width:880px;margin:0 auto;padding:10px 16px 60px}   /* 和 PLL / OLL 同宽 —— 左边目录才会落在同一个位置 */

  section{margin:26px 0 0;background:var(--card);border:1px solid var(--line);
          border-radius:12px;overflow:hidden}
  section > h2{margin:0;padding:11px 16px;font-size:14px;font-weight:600;
               background:var(--head-band);border-bottom:1px solid var(--line)}
  section > h2 .cnt{float:right;color:var(--muted);font-weight:400;font-size:12.5px}

  table{width:100%;border-collapse:collapse;table-layout:fixed}
  col.side{width:96px}
  col.formula{width:auto}
  col.pick{width:38px}          /* 展开键那一列（打印时收成 0，不留空列） */
  th{padding:9px 12px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line);
     border-right:1px solid var(--line);background:var(--chip)}
  th.red{color:var(--head-red)} th.green{color:var(--head-green)}
  th:last-child{border-right:none}
  th.fh{border-right:0}                      /* 表头里「公式列」那格：和 td.f 一样不留框（那边框属于展开键那列） */
  td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle}
  td:last-child{border-right:none}
  tr:last-child td{border-bottom:none}
  /* 图片是透明底 PNG，这一格就不铺底色，整页保持纯白 */
  td.pic{padding:6px;text-align:center}
  td.pic .box{position:relative;display:inline-block;line-height:0}
  /* 给图片预留高度（F2L 的图是 256x258），否则懒加载完成后整行会被撑高 */
  td.pic img{width:84px;height:auto;aspect-ratio:256/258;display:block;margin:0 auto;
             image-rendering:auto;border-radius:6px}
  /* 编号角标，和 oll/pll 一致 */
  td.pic .no{position:absolute;left:3px;top:1px;font-size:11px;font-weight:600;
             color:var(--muted);line-height:1;background:var(--badge);
             padding:1px 3px;border-radius:4px}
  td.f{padding:9px 12px;border-right:0}      /* 展开键左边不留那道表格框（和 PLL / OLL / 二阶一致） */
  td.pickCell{padding:4px 2px;text-align:center;width:38px}
  /* 空白格 = 单图形行（07/08/09）的另一半：图片列一格 + 公式/展开键两列合成一格。
     左边那道框（和左边那半的分界）显式留着，免得哪天左边那格的右边框一改就跟着缺口；
     合成的那格（.emptyTail）左边不要再画线 —— 正常行里「公式格 / 展开键格」之间本来就没有框。 */
  td.empty{background:var(--chip);border-left:1px solid var(--line)}
  td.emptyTail{border-left:0}

  /* 公式：等宽，点一下复制 */
  code{font:13.5px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
       cursor:pointer;word-break:break-word;border-radius:5px;padding:2px 5px;margin:-2px -5px}
  code:hover{background:var(--chip)}
  code.copied{background:var(--accent);color:var(--on-accent, #fff)}
  /* 「在计算器里打开」：把公式带过去，省得手抄。
     一列里几十个这种钮，常亮会抢公式的戏 —— 平时只留一个淡淡的计算器图标，
     指到哪一行（或指到按钮本身）才亮成实心圆钮。 */
  a.tocalc{flex:none;align-self:center;display:inline-flex;align-items:center;
           justify-content:center;width:20px;height:20px;margin-left:7px;
           border-radius:50%;color:var(--muted);background:transparent;
           border:1px solid transparent;opacity:.55;text-decoration:none;
           transition:opacity .14s,color .14s,background .14s,border-color .14s,
                      transform .14s,box-shadow .14s}
  a.tocalc svg{width:13px;height:13px;display:block}
  tr:hover a.tocalc,a.tocalc:hover,a.tocalc:focus-visible{opacity:1}
  a.tocalc:hover,a.tocalc:focus-visible{color:var(--on-accent, #fff);background:var(--accent);
           border-color:var(--accent);transform:translateY(-1px);box-shadow:0 2px 7px #00000026}
  @media (hover:none){a.tocalc{opacity:1}}
  .fw{display:flex;flex-wrap:wrap;align-items:baseline;margin:2px 0}
  /* 兜底：一格只显示第一条写法（脚本没跑起来 / 库里写法变多时也不会挤在一起） */
  td.f .fw ~ .fw{display:none}

  /* 展开键（换一条写法）：和 a.tocalc 同一套语言的小圆钮，摆在公式格右边那一列。
     只有一条写法时加 .off（淡掉、点不动）。 */
  button.pick{display:inline-flex;align-items:center;justify-content:center;font:inherit;
         width:30px;height:26px;border-radius:8px;vertical-align:middle;
         color:var(--text);background:none;border:0;outline-offset:2px;
         opacity:.62;cursor:pointer;transition:opacity .14s,color .14s,background .14s}
  button.pick svg{width:18px;height:18px;display:block}
  tr:hover button.pick,button.pick:hover{opacity:1;color:var(--accent-text)}
  button.pick.on{opacity:1;color:var(--accent-text);background:var(--chip)}
  button.pick.off{opacity:.22;pointer-events:none;cursor:default}
  tr:hover button.pick.off{opacity:.22;color:var(--text)}
  /* 候选面板：缩略图 + 编号 + 公式，一列排开。开合要能过渡，
     所以不用 display:none 切换 —— 用透明度 / 位移把隐藏态演出来。 */
  .pickbox{position:absolute;z-index:9;display:flex;flex-direction:column;gap:2px;padding:6px;
           max-width:430px;max-height:52vh;overflow:auto;text-align:left;
           background:var(--panel);border:1px solid var(--line);border-radius:10px;
           box-shadow:0 12px 30px #00000026;
           opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top right;
           transition:opacity .16s ease,transform .16s ease,visibility .16s}
  .pickbox.up{transform:translateY(6px) scale(.98);transform-origin:bottom right}
  .pickbox.on{opacity:1;visibility:visible;transform:none}
  .pickbox button{display:flex;align-items:center;gap:8px;padding:4px 6px;border:0;border-radius:8px;
                  background:none;color:var(--text);font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;
                  text-align:left;cursor:pointer}
  .pickbox button:hover{background:var(--chip)}
  /* 当前这一行正在显示的那条也列在面板里，并高亮它 */
  .pickbox button.cur{background:var(--chip);color:var(--accent-text);box-shadow:inset 2px 0 0 var(--accent)}

  .pickbox img{width:34px;height:34px;flex:none;border-radius:5px}
  .pickbox .idx{flex:none;min-width:16px;text-align:right;color:var(--muted);
                font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

  /* 复制提示 */
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
         background:#111a;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;
         opacity:0;pointer-events:none;transition:.18s}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 左边这条「三阶公式」目录：和教程页 / 二阶那两页那条同一套做法 ——
     固定在正文左侧（导航条底下），窄屏收起；当前这一页那条高亮。
     ⚠ 这一页的表格里有 <col class="side">（F2L 那种「图 + 公式」两列），
     所以这里的规则必须限定成 nav.side，不能裸写 .side —— 否则打印时
     「.side{display:none}」会把那两列一起藏掉，列宽全乱。 */
  /* 目录和 PLL / OLL / 二阶那两页**同一个位置**：正文都是 880 宽，
       正文左边缘 = 50% - 440，目录左边 = 再往左让 152（目录宽）+ 16（留白）= 50% - 616；
       窄到两边放不下（< 1240px）就整条收起来 —— 阈值也和那几页一致。 */
  nav.side{position:fixed;width:152px;display:flex;flex-direction:column;gap:2px;z-index:3;
        top:calc(var(--nav-h, 63px) + 16px);left:max(14px, calc(50% - 616px));
        align-items:flex-start}
  nav.side a{color:var(--muted);text-decoration:none;font-size:12.5px;line-height:1.5;
          padding:4px 9px;border-radius:7px;border-left:2px solid transparent;white-space:nowrap}
  nav.side a:hover{color:var(--accent-text);background:var(--chip)}
  nav.side a.on{color:var(--text);border-left-color:var(--accent);background:var(--chip)}
  @media (max-width:1240px){ nav.side{display:none} }

  @media (max-width:720px){
    col.side{width:64px}
    col.pick{width:32px}
    td.pic img{width:56px}
    td.f{padding:8px 9px}
    td.pickCell{width:32px}
    code{font-size:12px}
  }
  @media print{
    body{background:#fff;color:#000}
    .themebtn,.printbtn,nav.side,.toolbtn{display:none}
    .pickbox,button.pick{display:none}
    /* ⚠ 展开键那一格**不能 display:none**：这张表一行有两组「图 / 公式 / 键」，
       抽掉格子会让这一行后面的格子整体左移串列 —— 右半边的公式会挤进 0 宽的列里，
       纸上就整片空白（用户报过「打印右边一半公式都消失了」）。
       收成 0 宽的空格即可；框线留给它（和屏幕上一个道理）。 */
    td.pickCell{padding:0;width:0}
    col.pick{width:0}
    a.tocalc{display:none}
    /* 打印分页：卡片别拦着分页 —— break-inside:avoid + overflow:hidden 会让整张表
       变成「不可拆分的一块」，这一页装不下就整节推到下一页，标题也跟着单独占一页。
       现在让表格跨页接着排，只禁止「一行被劈成两半」；标题不落在页尾当孤儿。 */
    main{padding:0}
    header{padding:0 0 6px;break-after:avoid}
    section{break-inside:auto;overflow:visible;border-radius:0;border-color:#999;margin:10px 0 0}
    section > h2{break-after:avoid;border-radius:0}
    tr{break-inside:avoid}
    /* 打印：纸上比屏幕费眼 —— 表格框线加粗、公式文字调大 */
    table{border:2px solid #333}
    th,td{border:1px solid #333}
    /* 这两条要在上面那条之后：打印时也和屏幕上一样，公式格 / 表头那格右边不留框 */
    td.f{border-right:0}
    th.fh{border-right:0}
    td.empty{border-left:1px solid #333}     /* 空白格左边那道框，纸上也留着 */
    td.emptyTail{border-left:0}
    th{border-bottom-width:2px}
    code{font-size:15px;font-weight:600}
    thead{display:table-header-group}   /* 换页后红/绿 F 表头再来一遍 */
    code:hover{background:none}
    #toast{display:none}
  }
</style>
<link rel="stylesheet" href="css/nav.css">
<script>/* 主题必须在首次绘制前定好，否则会先用浅色画一遍再翻深色（闪一下） */
try{if(localStorage.getItem('cube-theme')!=='light')document.documentElement.dataset.theme='dark'}catch(e){}</script>

<body>
  <nav class="side" aria-label="三阶公式目录">
    <a class="on" href="f2l.html">F2L · 39 种</a>
    <a href="oll.html">OLL · 57 种</a>
    <a href="pll.html">PLL · 21 种</a>
  </nav>


<script src="js/nav.js"></script>
<header>
  <h1>F2L</h1>
  <p>First Two Layers</p>
  <button class="themebtn" id="themebtn" type="button" title="切到夜晚"></button>
  <button class="printbtn" id="printbtn" type="button" title="打印 / 存成 PDF"
          aria-label="打印"><svg viewBox="0 0 24 24"><path d="M7 10.5V4h10v6.5"/><path
    d="M7 18.5H5.2A2.2 2.2 0 0 1 3 16.3v-3.6a2.2 2.2 0 0 1 2.2-2.2h13.6A2.2 2.2 0 0 1 21 12.7v3.6a2.2 2.2 0 0 1-2.2 2.2H17"/><path
    d="M7 14.5h10v6H7z"/></svg></button>
</header>

<main id="app"></main>

<div id="toast"></div>

<script src="js/algpicks.js"></script>
<script>
/* 行数据来自数据库（data/f2l.json → js/f2ldata.js，tools/emit_pages.py 生成）：
   三节，每节若干行；每行左右两格（左 = 红色为 F 面，右 = 绿色为 F 面，没有右格就是 null）。
   **F2L 不做转体**：一个情况一张固定视角的图（img/f2l/f2l-<编号>-256x258.png），
   一个情况可以有多条写法（现在只有 07 有两条）。
   公式严格照原表誊录（含原表的 U'2 / L'2 这类写法）—— 改公式请改库再重跑生成器，别改这里。 */
var F2L = (typeof F2L_DB !== 'undefined' && F2L_DB.cases) ? F2L_DB : { sections: [], cases: [] };
var F2L_BY_ID = {};
F2L.cases.forEach(function (c) { F2L_BY_ID[c.id] = c; });
/* 首屏一格只显示**第一条**写法（和 PLL / OLL / 二阶那几页一样），
   其余写法在展开键里换 —— 以前这里是几条并排铺在一格，容易看花。
   （formulas() 本来就按换行拆多条，这里给一条就是一条；CSS 里也留了「只显示第一个 .fw」的兜底。） */
function algText(id) {
  var c = id ? F2L_BY_ID[id] : null;
  return c && c.algs.length ? c.algs[0].alg : null;
}
var SECTIONS = (F2L.sections || []).map(function (sec) {
  return { title: sec.title, rows: (sec.rows || []).map(function (r) {
    return { a: r[0], b: r[1], af: algText(r[0]), bf: algText(r[1]) };
  }) };
});

var IMG = function (name) { return 'img/f2l/f2l-' + name + '-256x258.png'; };

function esc(s) {
  return String(s).replace(/[&<>]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
  });
}
/* 「在计算器里打开」的小图标：一台计算器（显示屏 + 四个键）。
   内联 SVG，跟着 currentColor 走，白天/夜晚都不用改。 */
var CALC_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
  '<rect x="4.4" y="2.8" width="15.2" height="18.4" rx="3.2" fill="none" ' +
  'stroke="currentColor" stroke-width="2.1"/>' +
  '<path d="M8.1 7.4h7.8" fill="none" stroke="currentColor" stroke-width="2.1" ' +
  'stroke-linecap="round"/>' +
  '<circle cx="9.4" cy="12.3" r="1.35" fill="currentColor"/>' +
  '<circle cx="14.6" cy="12.3" r="1.35" fill="currentColor"/>' +
  '<circle cx="9.4" cy="16.6" r="1.35" fill="currentColor"/>' +
  '<circle cx="14.6" cy="16.6" r="1.35" fill="currentColor"/></svg>';
/* 展开键的图标：三行「点 + 圆头条」，和 PLL / OLL / 单手 / 二阶那几页一致 */
var PICK_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
  '<circle cx="6.4" cy="7" r="2.1" fill="currentColor" stroke="none"/>' +
  '<circle cx="6.4" cy="12" r="2.1" fill="currentColor" stroke="none"/>' +
  '<circle cx="6.4" cy="17" r="2.1" fill="currentColor" stroke="none"/>' +
  '<rect x="10.6" y="5.6" width="11" height="2.8" rx="1.4" fill="currentColor" stroke="none"/>' +
  '<rect x="10.6" y="10.6" width="11" height="2.8" rx="1.4" fill="currentColor" stroke="none"/>' +
  '<rect x="10.6" y="15.6" width="11" height="2.8" rx="1.4" fill="currentColor" stroke="none"/></svg>';
/* 一行里可能有多条公式（换行分隔），逐条渲染成可点的 code */
function toCalc(alg, id) {
  // F2L 的 **b 版**是「绿色为 F 面」写的（01b、02b…），要告诉计算器，让它按 y 公式 y' 执行。
  // 约定：hash 以 @g: 开头表示「绿面朝前」。
  // 判据写成「数字 + b」，不要写成 /b$/ —— 别的页面（PLL 的 Ab/Gb/Nb…）里那个 b
  // 是「第二个变体」的意思，和这里毫无关系，一个 /b$/ 会把它们全当成 b 版。
  var green = /^\d+b$/.test(String(id || ''));
  var frag = (green ? '@g:' : '') + encodeURIComponent(alg);
  var tip = '在计算器里打开这条公式' + (green ? '（绿色为 F 面）' : '');
  return '<a class="tocalc" href="calc.html#' + frag + '" title="' + tip +
         '" aria-label="' + tip + '">' + CALC_ICON + '</a>';
}
function formulas(text, id) {
  if (!text) return '';
  return text.split('\n').map(function (line) {
    return '<span class="fw"><code>' + esc(line) + '</code>' + toCalc(line, id) + '</span>';
  }).join('');
}
/* 展开键那一格：情况只有一条写法时模板里就是淡态（.off + disabled），
   有别的写法时脚本会把 .off 摘掉（改库加写法后自动亮）。 */
function pickCell(id) {
  var c = id ? F2L_BY_ID[id] : null;
  var one = !c || (c.algs || []).length < 2;
  if (!id) return '<td class="empty"></td>';
  return '<td class="pickCell"><button type="button" class="pick' + (one ? ' off' : '') +
         '"' + (one ? ' disabled' : '') + ' data-f2l="' + esc(id) + '" title="' +
         (one ? '换一条写法 / 自己加一条' : '换一条写法 / 自己加一条') + '" aria-label="换一条写法">' +
         PICK_ICON + '</button></td>';
}
/* 半边：有情况就是「图 + 公式 + 展开键」三格。
   没有情况（07/08/09 的另一半）分**两格**：图片列单独一格（**保住它右边那道竖格线**，
   和上面几行的列线对齐），公式 + 展开键那两列合成一格（不要框 —— 最右边原本那个小格子很难看）。 */
function side(id, text) {
  if (!id) return '<td class="empty"></td><td class="empty emptyTail" colspan="2"></td>';
  return pic(id, text) + '<td class="f" data-f2l="' + esc(id) + '">' + formulas(text, id) + '</td>' +
         pickCell(id);
}
function pic(name, alt) {
  if (!name) return '<td class="empty"></td>';
  // 角标去掉前导 0（01a -> 1a）；文件名不能动，磁盘上就叫 01a
  var label = name.replace(/^0+/, '');
  return '<td class="pic"><span class="box"><img src="' + IMG(name) + '" data-zoom data-f2l="' +
         esc(name) + '" alt="' +
         esc(alt) + '" loading="lazy"><span class="no">' + esc(label) +
         '</span></span></td>';
}

var html = '';
SECTIONS.forEach(function (sec) {
  html += '<section><h2>' + esc(sec.title) +
          '<span class="cnt">' + sec.rows.length + '</span></h2><table>' +
          '<colgroup><col class="side"><col class="formula"><col class="pick">' +
          '<col class="side"><col class="formula"><col class="pick"></colgroup>' +
          '<thead><tr>' +
          '<th class="red">红 F</th><th class="fh"></th><th></th>' +
          '<th class="green">绿 F</th><th class="fh"></th><th></th>' +
          '</tr></thead><tbody>';
  sec.rows.forEach(function (r) {
    html += '<tr>' + side(r.a, r.af) + side(r.b, r.bf) + '</tr>';
  });
  html += '</tbody></table></section>';
});
document.getElementById('app').innerHTML = html;
/* ---------- 每一格的「展开选写法」 ----------
   和 PLL / OLL / 单手 / 二阶那几页同一套（公式格右边那一列的小圆钮）：
   候选 = 库里这个情况的其它写法（正在显示的那条不列进去），行内写法兜底；
   再点同一个键收起；展开时键亮起来；开合有过渡；点别处 / Esc / 缩放收回（滚动不收回）。
   **F2L 不做转体**：换写法时图不动 —— 一个情况就一张图。
   持久化键 cube-pick:f2l:<编号>。 */
(function () {
  'use strict';
  var KEY = 'cube-pick:f2l:';
  var byId = {};
/* 三个图标键（恢复默认 / 导出 CSV / 导入 CSV）+ 自定义公式：都交给 js/algpicks.js */
if (typeof AlgPicks !== 'undefined') AlgPicks.mountTools('f2l', {
  ids: function (id) { return !!byId[id]; },
  rows: function () { return AlgPicks.domRows('f2l', 'f2l'); },
  // 库里有同一条 → 返回它所在的画面（导入 CSV 时当「选中它」）；没有 → null（当自定义）
  find: function (id, alg) {
    var c = byId[id];
    if (!c) return null;
    var views = c.views || [{ view: 0, algs: c.algs || [] }];
    for (var i = 0; i < views.length; i++) {
      var as = views[i].algs || [];
      for (var j = 0; j < as.length; j++) {
        if (AlgPicks.algKey(as[j].alg) === AlgPicks.algKey(alg)) return { view: views[i].view || 0, alg: as[j].alg };
      }
    }
    return null;
  },
  onDone: function (t) { toast(t); }
});
  ((typeof F2L_DB !== 'undefined' && F2L_DB.cases) || []).forEach(function (c) { byId[c.id] = c; });
  var open = null;

  /* 「同一条公式」的判据：忽略括号和空白（库里带括号、别处可能不带） */
  function algKey(a) { return String(a).replace(/[()\s]/g, ''); }
  function load(id) { try { return localStorage.getItem(KEY + id) || ''; } catch (e) { return ''; } }
  function save(id, v) { try { localStorage.setItem(KEY + id, v); } catch (e) {} }
  /* 这条写法在 case 内的编号（库里唯一；找不到就退回面板顺序号） */
  function noOf(id, alg) {
    var c = byId[id];
    if (!c) return 0;
    var k = algKey(alg);
    var hit = (c.algs || []).filter(function (a) { return algKey(a.alg) === k; })[0];
    return hit ? (hit.no || 0) : 0;
  }
  /* 这一格能不能显示这条写法（存档里可能留着旧数据：写法被删了 / 改了） */
  function usable(id, alg) {
    var c = byId[id];
    if (!c) return false;
    if (typeof AlgPicks !== 'undefined' && AlgPicks.customView('f2l', id, alg) !== null) return true;
    var k = algKey(alg);
    return (c.algs || []).some(function (a) { return algKey(a.alg) === k; });
  }
  /* 候选：库里这个情况的其它写法；本格原有的写法兜底。
     去重的写和读必须是同一个键（都用 algKey）—— OH 页踩过：写 seen[alg] 查 seen[algKey]
     会把本行那条再加一遍，展开后就是两个一模一样的候选。 */
  function candidates(id, own, cur) {
    var out = [], seen = {};
    function add(alg) {
      if (!alg || seen[algKey(alg)]) return;
      seen[algKey(alg)] = 1;
      out.push(alg);
    }
    var c = byId[id];
    if (c) (c.algs || []).forEach(function (a) { add(a.alg); });
    (own || []).forEach(add);
    return out;
  }
  function close() {
    if (!open) return;
    open.box.classList.remove('on');
    open.pick.classList.remove('on');
    open = null;
  }
  /* 点别处收回 —— 但「正在展开的那个键」和面板自己不算别处，
     否则捕获阶段先清掉 open，再点同一个键就变成「重新打开」，收不起来。 */
  function closeIfOutside(t) {
    if (!open || !t) return;
    var p = open.pick, b = open.box;
    if (t === p || t === b) return;
    if (p.contains && p.contains(t)) return;
    if (b.contains && b.contains(t)) return;
    close();
  }
  function shown(cell) { var cd = cell.querySelector('code'); return cd ? cd.textContent : ''; }
  function ownAlgs(cell) {
    var out = [];
    Array.prototype.forEach.call(cell.querySelectorAll('code'), function (cd) {
      if (out.indexOf(cd.textContent) < 0) out.push(cd.textContent);
    });
    return out;
  }
  /* 换成这条写法：公式格重画成一条（带「跳计算器」的钮，@g: 规则照旧），记进存档 */
  function apply(row, alg) {
    row.cell.innerHTML = '<span class="fw"><code>' + esc(alg) + '</code>' +
                         toCalc(alg, row.id) + '</span>';
    save(row.id, alg);
  }
  function buildBox(row) {
    var cur = shown(row.cell);
    var list = candidates(row.id, ownAlgs(row.cell), cur);
    row.box.innerHTML = '';
    list.forEach(function (alg, i) {
      var b = document.createElement('button');
      b.type = 'button';
      if (algKey(alg) === algKey(cur)) b.classList.add('cur');      // 当前这一格显示的就是它
      b.innerHTML = '<img src="' + IMG(row.id) + '" alt="">' +
        '<b class="idx">' + (noOf(row.id, alg) || (i + 1)) + '</b><span>' + alg + '</span>';
      b.addEventListener('click', function (e) {
        e.preventDefault(); e.stopPropagation();
        apply(row, alg);
        close();
      });
      row.box.appendChild(b);
    });
    /* 面板最后再摆一行「自定义」：选画面 + 填公式（不检查对错）+ 添加；
       已有的自定义公式当普通候选摆在前面。逻辑都在 js/algpicks.js。 */
    if (typeof AlgPicks !== 'undefined') AlgPicks.decoratePanel(row.box, {
      page: 'f2l', id: row.id, esc: esc,
      views: (byId[row.id] && byId[row.id].views ? byId[row.id].views.length : 1),
      imgOf: function (view) { return IMG(row.id); },
      pick: function (alg) { apply(row, alg); },
      rebuild: function () { buildBox(row); },
      close: close
    });
    return list.length;
  }
  /* 展开键和公式格用 data-f2l 对上（一格里一个键；单图形行的另一半是空单元格） */
  var picks = {};
  Array.prototype.forEach.call(document.querySelectorAll('button.pick[data-f2l]'), function (b) {
    picks[b.getAttribute('data-f2l')] = b;
  });
  Array.prototype.forEach.call(document.querySelectorAll('#app td.f[data-f2l]'), function (cell) {
    var id = cell.getAttribute('data-f2l');
    var pick = id ? picks[id] : null;
    if (!id || !pick) return;
    var row = { id: id, cell: cell, pick: pick, box: document.createElement('div') };
    row.box.className = 'pickbox';

    /* 恢复上次的选择：存档里有、这一页现在还能显示、且不是正在显示的那条，就应用它 */
    var cur = load(id);
    if (cur && usable(id, cur) && algKey(cur) !== algKey(shown(cell))) apply(row, cur);

    /* 每个展开键都能点：只有一条写法也点得开 —— 面板最后一行是「自定义…」，
       可以在那儿自己填一条（所以不再有「只有一条写法就淡掉」的键）。 */
    pick.classList.remove('off');
    pick.disabled = false;
    pick.title = '换一条写法 / 自己加一条';

    pick.addEventListener('click', function (e) {
      e.preventDefault(); e.stopPropagation();
      if (open && open.pick === pick) { close(); return; }   // 再点同一个键 = 收起
      close();
      var n = buildBox(row);
      if (!n) { pick.title = '这个情况只有一条写法'; close(); return; }
      pick.title = '换一条写法（共 ' + n + ' 条）';
      pick.classList.add('on');
      document.body.appendChild(row.box);
      var r = pick.getBoundingClientRect();
      var sx = window.pageXOffset || document.documentElement.scrollLeft || 0;
      var sy = window.pageYOffset || document.documentElement.scrollTop || 0;
      row.box.style.left = Math.max(8, Math.min(r.left + sx - 380, sx + window.innerWidth - 440)) + 'px';
      var below = r.bottom + 6, up = false;
      if (below + row.box.offsetHeight > window.innerHeight) {
        below = Math.max(8, r.top - row.box.offsetHeight - 6);
        up = true;
      }
      row.box.style.top = (below + sy) + 'px';
      row.box.classList.toggle('up', up);
      void row.box.offsetWidth;                  // 先排一帧再挂 .on，否则是"蹦"出来
      row.box.classList.add('on');
      open = row;
    });
  });
  /* 点别处（捕获阶段）/ Esc / 缩放收回；滚动**不**收回 */
  document.addEventListener('click', function (e) { closeIfOutside(e.target); }, true);
  window.addEventListener && window.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  window.addEventListener && window.addEventListener('resize', close);
})();

/* 下次从导航条 / 首页点「三阶公式」要回到这一次看的那一页（nav.js 读这个键）——
   和教程那两页、二阶那两页一个做法：键名是这一组的第一个页面 */
try { localStorage.setItem('cube-last:f2l.html', 'f2l.html'); } catch (e) {}
/* 夜晚模式 */
var root = document.documentElement, themeBtn = document.getElementById('themebtn');
function applyTheme(t) {
  root.dataset.theme = t;
  themeBtn.title = t === 'dark' ? '切到白天' : '切到夜晚';
  try { localStorage.setItem('cube-theme', t); } catch (e) {}
}
var saved = null;
try { saved = localStorage.getItem('cube-theme'); } catch (e) {}
applyTheme(saved === 'light' ? 'light' : 'dark');
themeBtn.addEventListener('click', function () {
  applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
});

// 打印：旁边那个按钮直接调浏览器的打印（可以在打印对话框里选「存成 PDF」）
document.getElementById('printbtn').addEventListener('click', function () { window.print(); });

/* 点公式复制 */
var toastEl = document.getElementById('toast'), toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 1400);
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast(text); }
  catch (e) { toast('复制失败，请手动选择'); }
  ta.remove();
}
document.getElementById('app').addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('code') : null;
  if (!el) return;
  var text = el.textContent;
  // 去掉公式里的空格，粘进播放器/脚本更省事
  var compact = text.replace(/\s+/g, '');
  function done() {
    el.classList.add('copied');
    setTimeout(function () { el.classList.remove('copied'); }, 600);
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(compact).then(function () { done(); toast(compact); },
                                                function () { fallbackCopy(compact); done(); });
  } else {
    fallbackCopy(compact); done();
  }
});
</script>
</body>
</html>
